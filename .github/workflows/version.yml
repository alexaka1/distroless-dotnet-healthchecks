name: "Version packages"
on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      snapshot:
        required: false
        type: string
        description: 'Snapshot name to use when versioning. Leave empty to version normally. Set to "true" to snapshot without a name.'
    secrets:
      RELEASE_BOT_APP_ID:
        required: true
      RELEASE_BOT_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      snapshot:
        required: false
        type: choice
        options:
          - none
          - 'true'
          - hotfix
        default: none
        description: 'Snapshot name to use when versioning. Use none to version normally. Set to true to snapshot without a name.'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-changesets

permissions: {}

jobs:
  select-mode:
    name: Select Changesets mode
    if: ${{ inputs.snapshot == '' || inputs.snapshot == 'none' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: write
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

  version:
    name: Version packages
    if: ${{ (inputs.snapshot == '' || inputs.snapshot == 'none') && needs.select-mode.outputs.mode == 'version' }}
    needs: select-mode
    runs-on: ubuntu-24.04-arm
    environment: release
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Generate GitHub App token to create the version PR
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Version packages
        uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: pnpm run version
          commit-message: 'Version Packages'
          pr-title: 'Version Packages'

  publish:
    name: Tag release
    if: ${{ (inputs.snapshot == '' || inputs.snapshot == 'none') && needs.select-mode.outputs.mode == 'publish' }}
    needs: select-mode
    runs-on: ubuntu-24.04-arm
    environment: release
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Generate GitHub App token to push git tags
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create git tags
        uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: pnpm run changeset:tag
          create-github-releases: true
          push-git-tags: true

  snapshot:
    name: Create snapshot release
    if: ${{ inputs.snapshot != '' && inputs.snapshot != 'none' }}
    runs-on: ubuntu-24.04-arm
    environment: release
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Generate GitHub App token to create snapshot tags
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create snapshot release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SNAPSHOT: ${{ inputs.snapshot }}
          REPO: ${{ github.repository }}
          BRANCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          # Run version to update files locally
          pnpm run version

          # Stage all changes and commit if any
          git add -A

          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            BRANCH_NAME="$(echo "${BRANCH_REF}" | sed 's#refs/heads/##')"
            COMMIT_MESSAGE="chore(version): apply changesets snapshot=${SNAPSHOT}"

            git config user.name "alexaka1-release-bot[bot]"
            git config user.email "250976967+alexaka1-release-bot[bot]@users.noreply.github.com"

            # Commit and push using the app token user (simple flow)
            git commit -m "${COMMIT_MESSAGE}" || { echo "No changes to commit after staging"; exit 0; }
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:${BRANCH_NAME}"
          fi

          # Create git tags for the snapshot versions
          pnpm run changeset:tag

          # Push tags created by git-tag that point at HEAD
          TARGET_SHA="$(git rev-parse HEAD)"
          TAGS=( $(git tag --points-at "${TARGET_SHA}") )

          if [ "${#TAGS[@]}" -eq 0 ]; then
            echo "No tags found pointing at HEAD after tagging. Done."
            exit 0
          fi

          for TAG in "${TAGS[@]}"; do
            echo "Pushing tag ${TAG}"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/tags/${TAG}"
          done
